<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 — kotoba-loop</title>
    <style>
      /* D.2 design tokens (kotoba-loop-roadmap.md), hardcoded — this page is served
         directly by the service worker while offline, before any app CSS can load. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #c9c6f2;
        background-image: radial-gradient(rgba(30, 21, 51, 0.14) 1px, transparent 1px);
        background-size: 20px 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1e1533;
        padding: 16px;
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #fbf3e1;
        border: 2px solid #171018;
        box-shadow: 4px 4px 0 0 #171018;
        text-align: center;
      }
      .titlebar {
        background: #5b5fef;
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.02em;
        padding: 6px 10px;
        border-bottom: 2px solid #171018;
        text-align: left;
      }
      .body {
        padding: 32px 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: rgba(30, 21, 51, 0.7);
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        border: 2px solid #171018;
        box-shadow: 2px 2px 0 0 #171018;
        background: #5b5fef;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="titlebar">OFFLINE.EXE</div>
      <div class="body">
        <h1>오프라인 상태예요</h1>
        <p>인터넷 연결이 끊겼어요.<br />연결을 확인한 뒤 다시 시도해주세요.</p>
        <button type="button" onclick="location.reload()">다시 시도</button>
      </div>
    </div>
  </body>
</html>
